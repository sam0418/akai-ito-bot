# 在 GitHub Actions 上執行 experiments/ 裡的實驗。
# 觸發方式：
#   1. 手動觸發（Actions 頁面 → experiment → Run workflow）
#   2. 推送 exp-run/** 分支：參數放在 experiments/run-request.json，
#      跑完後結果會 commit 回同一個分支（GITHUB_TOKEN 的推送不會再觸發 workflow）
# 只使用 repo 內的虛構 fixtures；真實對話資料（data/）不在 repo 裡，這裡也碰不到。
# 金鑰來自 repo secret GEMINI_API_KEY，不會出現在程式碼或紀錄裡。
name: experiment

on:
  push:
    branches: ['exp-run/**']
  workflow_dispatch:
    inputs:
      experiment:
        description: 實驗資料夾（experiments/ 底下）
        default: 001-vca-lite
      condition:
        description: 實驗條件（A / B / C）
        default: A
      model:
        description: 模型（留空則用 src/Config.js 的設定）
        default: ''
      repeat:
        description: 重複次數
        default: '1'
      pace:
        description: 每次請求的間隔（毫秒）
        default: '4500'

permissions:
  contents: write     # 推送分支觸發時，把結果 commit 回同一個分支

concurrency:
  group: experiment          # 同時只跑一個，避免撞到 Gemini 免費方案的每分鐘上限
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve parameters
        id: params
        env:
          IN_EXPERIMENT: ${{ inputs.experiment }}
          IN_CONDITION: ${{ inputs.condition }}
          IN_MODEL: ${{ inputs.model }}
          IN_REPEAT: ${{ inputs.repeat }}
          IN_PACE: ${{ inputs.pace }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            f=experiments/run-request.json
            [[ -f "$f" ]] || { echo "缺少 $f"; exit 1; }
            IN_EXPERIMENT=$(jq -r '.experiment // "001-vca-lite"' "$f")
            IN_CONDITION=$(jq -r '.condition // "A"' "$f")
            IN_MODEL=$(jq -r '.model // ""' "$f")
            IN_REPEAT=$(jq -r '.repeat // 1' "$f")
            IN_PACE=$(jq -r '.pace // 4500' "$f")
          fi
          # 輸入一律先驗證，避免任意字串進到指令裡
          [[ "$IN_EXPERIMENT" =~ ^[0-9]{3}-[a-z0-9-]+$ ]]      || { echo "invalid experiment"; exit 1; }
          [[ "$IN_CONDITION" =~ ^[A-Za-z]$ ]]                  || { echo "invalid condition"; exit 1; }
          [[ -z "$IN_MODEL" || "$IN_MODEL" =~ ^[a-z0-9.-]+$ ]] || { echo "invalid model"; exit 1; }
          [[ "$IN_REPEAT" =~ ^[0-9]+$ && "$IN_PACE" =~ ^[0-9]+$ ]] || { echo "invalid number"; exit 1; }
          {
            echo "experiment=$IN_EXPERIMENT"
            echo "condition=$IN_CONDITION"
            echo "model=$IN_MODEL"
            echo "repeat=$IN_REPEAT"
            echo "pace=$IN_PACE"
          } >> "$GITHUB_OUTPUT"

      - name: Run experiment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPERIMENT: ${{ steps.params.outputs.experiment }}
          CONDITION: ${{ steps.params.outputs.condition }}
          MODEL: ${{ steps.params.outputs.model }}
          REPEAT: ${{ steps.params.outputs.repeat }}
          PACE: ${{ steps.params.outputs.pace }}
        run: |
          [[ -n "$GEMINI_API_KEY" ]] || { echo "請先在 repo 設定 secret GEMINI_API_KEY"; exit 1; }
          args=(--condition "$CONDITION" --repeat "$REPEAT" --pace "$PACE")
          [[ -n "$MODEL" ]] && args+=(--model "$MODEL")
          node "experiments/$EXPERIMENT/run.mjs" "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ steps.params.outputs.experiment }}-${{ github.run_id }}
          path: experiments/${{ steps.params.outputs.experiment }}/runs/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit results to the run branch
        if: always() && github.event_name == 'push'
        env:
          EXPERIMENT: ${{ steps.params.outputs.experiment }}
        run: |
          [[ -d "experiments/$EXPERIMENT/runs" ]] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add "experiments/$EXPERIMENT/runs/"
          if git diff --cached --quiet; then echo "no results"; exit 0; fi
          git commit -m "Results for $GITHUB_REF_NAME [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
